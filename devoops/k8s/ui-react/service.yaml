apiVersion: v1
kind: Service
metadata:
  name: devoops-ui-react
  namespace: devoops
spec:
  selector:
    app: devoops-ui-react
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: devoops-ui-react-external
  namespace: devoops
spec:
  selector:
    app: devoops-ui-react
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30901
  type: NodePort
---
# Internal service for Flask backend (used by nginx proxy)
apiVersion: v1
kind: Service
metadata:
  name: devoops-ui-backend
  namespace: devoops
spec:
  selector:
    app: devoops-ui-react
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
