apiVersion: apps/v1
kind: Deployment
metadata:
  name: devoops-agent
  namespace: devoops
  labels:
    app: devoops-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devoops-agent
  template:
    metadata:
      labels:
        app: devoops-agent
    spec:
      serviceAccountName: devoops-agent
      containers:
        - name: agent
          image: devoops:latest
          imagePullPolicy: Never  # For local development
          ports:
            - containerPort: 5000
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: devoops-config
                  key: ANTHROPIC_API_KEY
            - name: MODE
              value: "server"
            - name: PORT
              value: "5000"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
