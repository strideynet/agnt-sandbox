apiVersion: apps/v1
kind: Deployment
metadata:
  name: devoops-agent
  namespace: devoops
  labels:
    app: devoops-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devoops-agent
  template:
    metadata:
      labels:
        app: devoops-agent
    spec:
      serviceAccountName: devoops-agent
      containers:
        - name: agent
          image: devoops:latest
          imagePullPolicy: Never  # For local development
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: devoops-config
                  key: ANTHROPIC_API_KEY
            - name: MISSION
              value: "Deploy a simple nginx web server in the default namespace with a Service, then verify it's working by making an HTTP request to it"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
