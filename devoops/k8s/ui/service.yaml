apiVersion: v1
kind: Service
metadata:
  name: devoops-ui
  namespace: devoops
spec:
  selector:
    app: devoops-ui
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: devoops-ui-external
  namespace: devoops
spec:
  selector:
    app: devoops-ui
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30900
  type: NodePort
