[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devoops"
version = "0.1.0"
description = "Kubernetes DevOps agent with delegated permissions"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "kubernetes>=31.0.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "flask>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["devoops*"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
